name: Site stopped working
description: Downloads from a site that used to work now fail.
labels: ["site"]
body:
  - type: markdown
    attributes:
      value: |
        Sites change often, and most of these are fixed by **updating yt-dlp first**:
        - Docker: pull or rebuild the latest AnyGet image (`git pull && make up`).
        - From source: `cd apps/api && uv lock --upgrade-package yt-dlp && uv sync`.

        If it still fails after updating, please fill this in. Only public links that anyone can open, please.
        AnyGet never gets around DRM, paywalls, logins, region blocks or members-only content: "this video is members-only" is not a bug.
  - type: checkboxes
    id: updated
    attributes:
      label: Before you report
      options:
        - label: I updated yt-dlp (or AnyGet) and tried again.
          required: true
        - label: The content is public, and I am allowed to download it.
          required: true
  - type: input
    id: site
    attributes:
      label: Site
      placeholder: "e.g. vimeo.com"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: A public example link (optional)
      description: Only a link anyone can open. Leave empty if it is private.
  - type: textarea
    id: error
    attributes:
      label: The error message
      description: What AnyGet shows (open Details on the failed download).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AnyGet and yt-dlp versions
      description: "AnyGet: open /api/version on your AnyGet. yt-dlp: Settings → Advanced → yt-dlp → Check for updates."
    validations:
      required: true
