name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository. Actions are pinned to full commit SHAs (the
# version is in the comment); Dependabot proposes updates (.github/dependabot.yml).
permissions:
  contents: read

jobs:
  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tools for thumbnail tests (ffmpeg, pdftoppm)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg poppler-utils
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy anyget tests
      - run: uv run pytest
      - name: OpenRouter model IDs still exist (informational)
        continue-on-error: true
        run: uv run anyget llm-models
      - name: Example plugin loads and passes its tests
        working-directory: examples/anyget-plugin-example
        run: uv sync --locked && uv run pytest -q

  web:
    name: Web (lint, typecheck, vitest, build, codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: pnpm gen && git diff --exit-code -- packages/shared
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  extension:
    name: Browser extension (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anyget/extension lint
      - run: pnpm --filter @anyget/extension typecheck
      - run: pnpm --filter @anyget/extension test
      - run: pnpm --filter @anyget/extension build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anyget-extension
          path: apps/extension/dist/*.zip
          retention-days: 30

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --locked
      - run: pnpm --filter @anyget/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images and health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl -fsS http://127.0.0.1:8000/api/health
      - run: curl -fsS http://127.0.0.1:3000/api/health
      - if: always()
        run: docker compose logs && docker compose down

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks 8.30.1, pinned by digest. Reviewed findings are listed in .gitleaksignore.
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --log-opts=--all
          --gitleaks-ignore-path /repo/.gitleaksignore

  audit:
    name: Dependency audit (pnpm, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      # What ships (production dependencies), high and critical advisories.
      - run: pnpm audit --prod --audit-level=high
      - name: Python dependencies (API and the example plugin)
        run: |
          for project in apps/api examples/anyget-plugin-example; do
            (cd "$project" && uv export --frozen --no-hashes --all-extras --no-emit-project \
              | grep -v -e '^-e ' -e 'file://' > "$RUNNER_TEMP/requirements.txt")
            uvx --from pip-audit==2.9.0 pip-audit --strict --no-deps --disable-pip \
              -r "$RUNNER_TEMP/requirements.txt"
          done
