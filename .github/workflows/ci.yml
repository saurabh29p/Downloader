name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - name: Tools for thumbnail tests (ffmpeg, pdftoppm)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg poppler-utils
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy anyget tests
      - run: uv run pytest
      - name: OpenRouter model IDs still exist (informational)
        continue-on-error: true
        run: uv run anyget llm-models
      - name: Example plugin loads and passes its tests
        working-directory: examples/anyget-plugin-example
        run: uv sync --locked && uv run pytest -q

  web:
    name: Web (lint, typecheck, vitest, build, codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: pnpm gen && git diff --exit-code -- packages/shared
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  extension:
    name: Browser extension (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anyget/extension lint
      - run: pnpm --filter @anyget/extension typecheck
      - run: pnpm --filter @anyget/extension test
      - run: pnpm --filter @anyget/extension build
      - uses: actions/upload-artifact@v4
        with:
          name: anyget-extension
          path: apps/extension/dist/*.zip
          retention-days: 30

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --locked
      - run: pnpm --filter @anyget/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images and health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl -fsS http://127.0.0.1:8000/api/health
      - run: curl -fsS http://127.0.0.1:3000/api/health
      - if: always()
        run: docker compose logs && docker compose down
