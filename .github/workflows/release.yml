name: Release

# Push a tag like v2.0.0: builds and pushes the Docker images to GitHub Container
# Registry, builds the browser extension, and publishes a GitHub release with the
# CHANGELOG section for that version.
#
# No third-party actions here: images are built with the runner's own docker buildx and
# the release is made with the GitHub CLI (gh). The only actions are GitHub's and pnpm's,
# pinned to full commit SHAs.
on:
  push:
    tags: ["v*.*.*"]

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  images:
    name: Docker images (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            file: apps/api/Dockerfile
            target: runtime
          - name: web
            context: .
            file: apps/web/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ steps.meta.outputs.owner }}/anyget-${{ matrix.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          CONTEXT: ${{ matrix.context }}
          FILE: ${{ matrix.file }}
          TARGET: ${{ matrix.target }}
        run: |
          docker buildx build "$CONTEXT" --file "$FILE" ${TARGET:+--target "$TARGET"} \
            --build-arg API_URL=http://api:8000 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            --push
      - if: always()
        run: docker logout ghcr.io

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anyget/extension build
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" apps/extension/dist/*.zip
          --repo "$GITHUB_REPOSITORY" --title "AnyGet ${GITHUB_REF_NAME#v}"
          --notes-file notes.md --verify-tag
