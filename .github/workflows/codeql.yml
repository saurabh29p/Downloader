name: CodeQL

# Code scanning for Python and JavaScript/TypeScript. CodeQL is free for public
# repositories, so the analysis steps run only once the repository is public; until then
# the job just says so.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - if: github.event.repository.private
        run: echo "The repository is private; CodeQL runs once it is public."
      - if: ${{ !github.event.repository.private }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
