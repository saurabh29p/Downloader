[project]
name = "anyget"
version = "0.1.0"
description = "AnyGet core: paste any public link, get the file."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54",
    "sqlmodel>=0.0.48",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "typer>=0.27",
    "rich>=15",
]

[project.scripts]
anyget = "anyget.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyget"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: hits the real network with public-domain/CC links; run manually"]
