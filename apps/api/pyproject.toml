[project]
name = "anyget"
version = "0.1.0"
description = "AnyGet core: paste any public link, get the file."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54",
    "sqlmodel>=0.0.48",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "typer>=0.27",
    "rich>=15",
    # Video/audio sites. The [default] extra pulls yt-dlp-ejs (YouTube challenge
    # solver run by Deno). Update with: uv lock --upgrade-package yt-dlp
    "yt-dlp[default]==2026.10.26",
    # Image galleries. GPL: only ever run as a separate process (python -m gallery_dl).
    "gallery-dl==1.32.19",
    "img2pdf==0.6.3",
    "defusedxml==0.7.1",
]

[project.scripts]
anyget = "anyget.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "types-defusedxml==0.7.0.20250822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyget"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S324", "ASYNC109", "ASYNC110", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "urllib3", "urllib3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: hits the real network with public-domain/CC links; run manually"]
