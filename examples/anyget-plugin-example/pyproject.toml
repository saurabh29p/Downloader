[project]
name = "anyget-plugin-example"
version = "0.1.0"
description = "Example AnyGet plugin: download xkcd comics (CC BY-NC 2.5) by link."
requires-python = ">=3.12"
dependencies = ["anyget"]

# This is what makes it a plugin: AnyGet loads the factory named here.
[project.entry-points."anyget.handlers"]
xkcd = "anyget_plugin_example:make"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-asyncio>=1.4", "respx>=0.23"]

[tool.uv.sources]
anyget = { path = "../../apps/api", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyget_plugin_example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
