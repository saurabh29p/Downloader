# AnyGet: `make up`, then open http://127.0.0.1:3000
# Ports are bound to 127.0.0.1 only. Public access goes through docker-compose.tunnel.yml.
name: anyget

services:
  api:
    build:
      context: ./apps/api
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ANYGET_DOWNLOADS_DIR: /downloads
      ANYGET_DATA_DIR: /data
      # Files are owned by this host user (make up sets them to your ids).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ./downloads:/downloads
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Live network tests in a container with ffmpeg + Deno: `make live`.
  api-test:
    profiles: ["test"]
    build:
      context: ./apps/api
      target: test
    environment:
      ANYGET_DOWNLOADS_DIR: /downloads
      ANYGET_DATA_DIR: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ANYGET_LIVE_PLAYLIST: ${ANYGET_LIVE_PLAYLIST:-}
      ANYGET_LIVE_COOKIES: ${ANYGET_LIVE_COOKIES:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
