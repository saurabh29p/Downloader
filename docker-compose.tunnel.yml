# Worldwide access through Cloudflare Tunnel. Use with: make up-public
# Needs TUNNEL_TOKEN (and ANYGET_ACCESS_TEAM_DOMAIN / ANYGET_ACCESS_AUD) in .env.
# Step-by-step setup: docs/deploy.md. No router ports are opened: cloudflared dials out.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env (see docs/deploy.md)}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    # Unprivileged: it only needs to reach web:3000 on the compose network.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
